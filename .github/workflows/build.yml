name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates android/ and ios/ (existing lib/, pubspec.yaml and test/ are kept).
      - name: Create platform folders
        run: flutter create --platforms=android,ios --project-name dental_jobs .

      # Release builds need the INTERNET permission, the default template omits it.
      - name: Add INTERNET permission
        run: |
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' android/app/src/main/AndroidManifest.xml
          grep INTERNET android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dental-jobs-apk
          path: build/app/outputs/flutter-apk/app-release.apk
